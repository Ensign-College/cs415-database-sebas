services:
  postgres:
    image: postgres:16
    container_name: cs415_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs415_db}
      POSTGRES_USER: ${POSTGRES_USER:-cs415_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs415_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
